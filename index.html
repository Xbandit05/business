    <meta property="og:title" content="AgriBridge Rwanda" />

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        // 1. Theme initialization
        try {
          var saved = localStorage.getItem('agribridge_theme');
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // 2. Shield against third-party Chrome extensions and browser extensions throwing unhandled messages/rejections
        // E.g. Window message "chrome: call method" timed out from injected extension scripts (bekkpoinfafbjglppgdobfdeckghdhlo)
        function isExternalExtensionError(err, source) {
          try {
            var msg = '';
            var stack = '';
            var src = (typeof source === 'string') ? source : '';

            if (err) {
              if (typeof err === 'string') {
                msg = err;
              } else {
                msg = (err.message || err.name || String(err));
                stack = err.stack || '';
              }
            }

            var combined = (msg + ' ' + stack + ' ' + src).toLowerCase();

            if (
              combined.indexOf('chrome: call method') !== -1 ||
              combined.indexOf('chrome-extension://') !== -1 ||
              combined.indexOf('moz-extension://') !== -1 ||
              combined.indexOf('safari-extension://') !== -1 ||
              combined.indexOf('bekkpoinfafbjglppgdobfdeckghdhlo') !== -1 ||
              combined.indexOf('resizeobserver loop') !== -1 ||
              combined.indexOf('extension context invalidated') !== -1
            ) {
              return true;
            }
          } catch (ignore) {}
          return false;
        }

        // Global capture of unhandled errors
        window.addEventListener('error', function(event) {
          if (isExternalExtensionError(event.error, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Global capture of unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          if (isExternalExtensionError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Override window.onerror
        var oldOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isExternalExtensionError(error, source) || isExternalExtensionError(message, source)) {
            return true; // suppresses the error from reaching AI Studio test runner
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
          return false;
        };

        // 3. Service Worker Management:
        // In preview environments, Cloud Run, localhost, or iframes, unregister existing service workers to avoid message channel timeouts
        try {
          var isDevOrPreview = (
            window.location.hostname.indexOf('run.app') !== -1 ||
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1' ||
            window.self !== window.top
          );

          if ('serviceWorker' in navigator) {
            if (isDevOrPreview) {
              navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (var i = 0; i < registrations.length; i++) {
                  registrations[i].unregister();
                }
              }).catch(function() {});
            } else {
              window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function() {});
              });
            }
          }
        } catch (swErr) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
